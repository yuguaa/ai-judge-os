name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build

      - name: 打包安装包（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --publish never

      - name: 上传 macOS 产物
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ai-judge-os-macos
          path: dist/*.dmg

      - name: 上传 Windows 产物
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ai-judge-os-windows
          path: |
            dist/*.exe
            dist/*.zip

      - name: 发布到 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
          generate_release_notes: true
