name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build

      - name: 打包应用（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run pack

      - name: 上传 macOS 产物
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ai-judge-os-macos
          path: dist/mac-arm64/*.app

      - name: 上传 Windows 产物
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ai-judge-os-windows
          path: |
            dist/win-unpacked/**
            dist/*.zip
            dist/*.exe
